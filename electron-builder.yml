appId: com.vuk.discordplus
productName: DiscordPlus
publish:
  provider: github
  owner: siqueirarfl
  repo: discordplus
  releaseType: release
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - nsis
  executableName: DiscordPlus
  icon: icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Discord+
  artifactName: Discord-Plus-Setup-${version}.exe
